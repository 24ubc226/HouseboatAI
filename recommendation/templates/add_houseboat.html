{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Houseboat | Houseboat AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #eef5f7;
            font-family: Arial, sans-serif;
        }

        .header {
            background: linear-gradient(
                135deg,
                #006d77,
                #008c95,
                #00a6a6
            );

            color: white;
            padding: 30px;
        }

        .form-card {
            max-width: 1100px;
            margin: 40px auto;
            border: none;
            border-radius: 20px;
        }

        .section-title {
            color: #006d77;
            font-weight: bold;
            border-bottom: 2px solid #e5eeee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }

    </style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h1 class="fw-bold">
                    🚤 Add Houseboat
                </h1>

                <p class="mb-0">
                    Add a new houseboat to the database
                </p>

            </div>

            <a
                href="{% url 'admin_houseboats' %}"
                class="btn btn-light fw-bold">

                ← Back

            </a>

        </div>

    </div>

</div>


<!-- FORM -->

<div class="container">

    <div class="card form-card shadow">

        <div class="card-body p-4 p-md-5">

            <form method="POST">

                {% csrf_token %}


                <!-- BASIC INFORMATION -->

                <h4 class="section-title">
                    🚤 Basic Information
                </h4>

                <div class="row g-3">

                    <div class="col-md-4">

                        <label class="form-label">
                            Houseboat ID *
                        </label>

                        <input
                            type="text"
                            name="houseboatid"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-8">

                        <label class="form-label">
                            Houseboat Name *
                        </label>

                        <input
                            type="text"
                            name="houseboatname"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Latitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            name="latitude"
                            class="form-control">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Longitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            name="longitude"
                            class="form-control">

                    </div>

                </div>


                <br>


                <!-- PRICE AND CAPACITY -->

                <h4 class="section-title">
                    💰 Price & Capacity
                </h4>

                <div class="row g-3">

                    <div class="col-md-4">

                        <label class="form-label">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            name="priceinr"
                            class="form-control">

                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            Season
                        </label>

                        <input
                            type="text"
                            name="season"
                            class="form-control">

                    </div>


                    <div class="col-md-2">

                        <label class="form-label">
                            Bedrooms
                        </label>

                        <input
                            type="number"
                            name="bedrooms"
                            class="form-control">

                    </div>


                    <div class="col-md-2">

                        <label class="form-label">
                            Capacity
                        </label>

                        <input
                            type="number"
                            name="capacity"
                            class="form-control">

                    </div>

                </div>


                <br>


                <!-- FEATURES -->

                <h4 class="section-title">
                    ⭐ Features
                </h4>

                <div class="row g-3">

                    {% for field,label in feature_fields %}

                    <div class="col-md-3">

                        <label class="form-label">
                            {{ label }}
                        </label>

                        <select
                            name="{{ field }}"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>

                    {% endfor %}


                    <div class="col-md-3">

                        <label class="form-label">
                            AC
                        </label>

                        <select
                            name="ac"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Luxury
                        </label>

                        <select
                            name="luxury"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Food
                        </label>

                        <select
                            name="food"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            WiFi
                        </label>

                        <select
                            name="wifi"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            TV
                        </label>

                        <select
                            name="tv"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Jacuzzi
                        </label>

                        <select
                            name="jacuzzi"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Fishing
                        </label>

                        <select
                            name="fishing"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Canoeing
                        </label>

                        <select
                            name="canoeing"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Upper Deck
                        </label>

                        <select
                            name="upperdeck"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Parking
                        </label>

                        <select
                            name="parking"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Pet Friendly
                        </label>

                        <select
                            name="petfriendly"
                            class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No" selected>
                                No
                            </option>

                        </select>

                    </div>

                </div>


                <br>


                <!-- OTHER INFORMATION -->

                <h4 class="section-title">
                    📊 Additional Information
                </h4>

                <div class="row g-3">

                    <div class="col-md-3">

                        <label class="form-label">
                            Rating
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="rating"
                            class="form-control">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Review Count
                        </label>

                        <input
                            type="number"
                            name="reviewcount"
                            class="form-control">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Booking Count
                        </label>

                        <input
                            type="number"
                            name="bookingcount"
                            class="form-control">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Availability
                        </label>

                        <input
                            type="text"
                            name="availability"
                            class="form-control">

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Trip Type
                        </label>

                        <input
                            type="text"
                            name="triptype"
                            class="form-control">

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Suitable For
                        </label>

                        <input
                            type="text"
                            name="suitablefor"
                            class="form-control">

                    </div>


                    <div class="col-md-12">

                        <label class="form-label">
                            Image File
                        </label>

                        <input
                            type="text"
                            name="imagefile"
                            class="form-control"
                            placeholder="example.jpg">

                    </div>

                </div>


                <br>


                <!-- BUTTONS -->

                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="{% url 'admin_houseboats' %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn btn-success px-4">

                        ➕ Add Houseboat

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>

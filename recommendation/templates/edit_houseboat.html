{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Houseboat | Houseboat AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef5f7;
            font-family:Arial,sans-serif;
        }

        .header{
            background:linear-gradient(135deg,#006d77,#008c95,#00a6a6);
            color:white;
            padding:35px;
            border-radius:0 0 30px 30px;
        }

        .card{
            border:none;
            border-radius:20px;
        }

        img{
            width:100%;
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="header">

    <div class="container">

        <div class="d-flex justify-content-between">

            <div>

                <h2>✏ Edit Houseboat</h2>

                <p>Edit Houseboat Information</p>

            </div>

            <a href="{% url 'admin_houseboats' %}" class="btn btn-light">

                ← Back

            </a>

        </div>

    </div>

</div>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 text-center">

                    <img src="{% static 'images/' %}{{ boat.imagefile }}">

                    <h4 class="mt-3">

                        {{ boat.houseboatname }}

                    </h4>

                </div>

                <div class="col-md-8">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button class="btn btn-success">

                            💾 Save Changes

                        </button>

                        <a href="{% url 'admin_houseboats' %}" class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

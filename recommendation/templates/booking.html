<!DOCTYPE html>
<html>
<head>
    <title>Book Houseboat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h3>Book {{ boat.houseboatname }}</h3>
</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit"
        class="btn btn-success"
        onclick="this.disabled=true; this.form.submit();">
    Confirm Booking
</button>

<a href="{% url 'details' boat.houseboatid %}" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

</body>
</html>

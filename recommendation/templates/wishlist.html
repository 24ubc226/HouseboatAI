<!DOCTYPE html>
{% load static %}

<html>

<head>

    <title>My Wishlist</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container mt-5">


    <h2 class="text-center fw-bold mb-5">
        ❤️ My Wishlist
    </h2>


    <div class="row g-4">


        {% for item in wishlist_list %}


        <div class="col-lg-4 col-md-6">


            <div class="card shadow h-100">


                <!-- HOUSEBOAT IMAGE -->

                <img
                    src="{% static 'images/' %}{{ item.boat.image_file }}"
                    class="card-img-top"
                    height="220"
                    style="object-fit: cover;"
                    alt="{{ item.boat.houseboatname }}"
                >


                <div class="card-body">


                    <!-- HOUSEBOAT NAME -->

                    <h5 class="fw-bold">

                        {{ item.boat.houseboatname }}

                    </h5>


                    <!-- LOCATION -->

                    <p>

                        📍 {{ item.boat.location }}

                    </p>


                    <!-- RATING -->

                    <p>

                        ⭐ {{ item.boat.rating }}

                    </p>


                    <!-- PRICE -->

                    <p class="fw-bold">

                        💰 ₹{{ item.boat.priceinr }}

                    </p>


                    <!-- VIEW DETAILS -->

                    <a
                        href="{% url 'details' item.boat.houseboatid %}"
                        class="btn btn-primary"
                    >

                        View Details

                    </a>


                    <!-- REMOVE WISHLIST -->

                    <a
                        href="{% url 'remove_wishlist' item.boat.houseboatid %}"
                        class="btn btn-outline-danger"
                    >

                        ❤️ Remove

                    </a>


                </div>


            </div>


        </div>


        {% empty %}


        <div class="col-12">


            <div class="alert alert-info text-center">

                Your wishlist is empty.

            </div>


        </div>


        {% endfor %}


    </div>


    <!-- BACK BUTTON -->

    <div class="text-center mt-5">

        <a
            href="{% url 'home' %}"
            class="btn btn-secondary"
        >

            ← Back to Houseboats

        </a>

    </div>


</div>


</body>

</html>

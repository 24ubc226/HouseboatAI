<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Manage Wishlist | Houseboat AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #eef5f7;
            font-family: Arial, sans-serif;
        }

        .page-header {
            background: linear-gradient(
                135deg,
                #006d77,
                #008c95,
                #00a6a6
            );

            color: white;
            padding: 35px;
            border-radius: 0 0 30px 30px;
        }

        .table-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }

        .table thead {
            background: #006d77;
            color: white;
        }

        .table tbody tr:hover {
            background: #fff5f8;
        }

    </style>

</head>

<body>


<!-- HEADER -->

<div class="page-header">

    <div class="container">

        <div class="d-flex
                    justify-content-between
                    align-items-center">

            <div>

                <h1 class="fw-bold">
                    ❤️ Manage Wishlist
                </h1>

                <p class="mb-0">
                    Monitor customer wishlist activity.
                </p>

            </div>

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn btn-light"
            >
                ← Dashboard
            </a>

        </div>

    </div>

</div>


<!-- WISHLIST -->

<div class="container py-5">

    <div class="card table-card shadow">

        <div class="card-body">

            <h3 class="fw-bold mb-4">
                ❤️ Wishlist Records
            </h3>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>#</th>
                            <th>User</th>
                            <th>Houseboat ID</th>

                        </tr>

                    </thead>

                    <tbody>

                    {% for item in wishlist %}

                        <tr>

                            <td>
                                {{ forloop.counter }}
                            </td>

                            <td class="fw-bold">
                                👤 {{ item.user.username }}
                            </td>

                            <td>
                                🚤 {{ item.houseboat }}
                            </td>

                        </tr>

                    {% empty %}

                        <tr>

                            <td
                                colspan="3"
                                class="text-center py-4"
                            >

                                No wishlist items found.

                            </td>

                        </tr>

                    {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
